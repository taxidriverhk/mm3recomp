; Settings for the recomp launcher (launcher\ submodule, built as mm3_launcher.exe).
; Format: launcher\DEVELOPERS.md. Your choices are saved to launcher.user.ini (not committed).

[game]
title=Midtown Madness 3
subtitle=Static recompilation (original Xbox)
exe=build\Release\mm3_recomp.exe
workdir={root}
stderr_log=run.log
stdout_log=run.log

[require]
game_files\default.xbe=Extract your disc into game_files\ first, see README.md.

[env]
; Needed for the game to run at all (README.md "Running").
; Audio codec reported ready so the XDK's DirectSoundCreate succeeds.
RECOMP_AC97_READY=1
; GPU renderer (src\d3d11_backend.c) and push-buffer execution.
RECOMP_D3D11=1
RECOMP_PB_EXEC=1
; Reuse freed memory (the toolkit ignores frees by default, which exhausts the 64 MB arena).
RECOMP_HEAP_RECLAIM=1
; One thread at DISPATCH_LEVEL at a time, DPCs included (NOTES 31).
RECOMP_DISPATCH_GATE=1

[setting.res]
group=Graphics
label=Internal resolution
type=choice
env=RECOMP_D3D11_RES
choices=1:1x  640x480 (console)|2:2x  1280x960|3:3x  1920x1440|4:4x  2560x1920|5:5x  3200x2400|6:6x  3840x2880
default=2
help=Above the window size the image is averaged down (supersampling AA). The window can be resized and keeps 4:3.

[setting.fxaa]
group=Graphics
label=FXAA edge smoothing
type=bool
env=RECOMP_D3D11_FXAA
default=0

[setting.vsync]
group=Graphics
label=Vertical sync
type=bool
env=RECOMP_D3D11_VSYNC
on=1
off=0
default=1

[setting.keyboard]
group=Input
label=Keyboard controls
type=bool
env=RECOMP_KEYBOARD
default=1
help=Arrows = D-pad, Enter = Start, Z/X/C/V = A/B/X/Y, WASD = left stick, 1/3 = triggers. XInput pads always work.

[setting.rumble]
group=Input
label=Rumble
type=bool
env=RECOMP_RUMBLE
on=1
off=0
default=1

[setting.stub_log]
group=Logging
label=Log unresolved functions
type=bool
env=RECOMP_STUB_LOG
default=1
help=Logs each unresolved-function stub the first time it is reached.

[setting.hitch]
group=Logging
label=Hitch log
type=choice
env=RECOMP_D3D11_HITCH
choices=:Off|33:Frames over 33 ms|60:Frames over 60 ms|100:Frames over 100 ms
default=60
help=A [HITCH] line for every slow frame, with the texture / shader-compile time spent in it (NOTES 35).

[setting.watchdog]
group=Logging
label=Hang watchdog
type=choice
env=RECOMP_WATCHDOG_SECS
choices=:Off|60:After 60 s|300:After 5 min|900:After 15 min
default=900
help=Writes a state dump to the log if the game stops making progress this long.

; ---------------------------------------------------------------------------------------------
; First-time setup (the launcher's Setup page): the player's disc, the tools, then scripts\regen_once.ps1.
[setup]
game_dir=game_files
game_check=default.xbe
game_sha1=e63b03dd956544d3838bead8be5622da6cd189e1
game_label=Your Midtown Madness 3 disc (2003, original Xbox)
intro=The launcher builds Midtown Madness 3 from your own copy of the game: it extracts the disc into game_files\, recompiles default.xbe to C and compiles it, which takes about 20 minutes. Choose your disc image (.iso), or a folder that holds the extracted disc, then press Run setup.

; install= is what the launcher offers to run (winget) when a check fails; checks and installs go in this order.
[check.git]
label=Git for Windows
command=git --version
hint=Install Git for Windows from https://git-scm.com/download/win and run setup again.
install=winget install --exact --silent --accept-package-agreements --accept-source-agreements --id Git.Git

[check.python]
label=Python 3.10+
command=python -c "import sys; sys.exit(sys.version_info < (3, 10))"
hint=Install Python 3.10 or newer from https://www.python.org (tick "Add python.exe to PATH").
install=winget install --exact --silent --accept-package-agreements --accept-source-agreements --id Python.Python.3.12 --override "/quiet InstallAllUsers=0 PrependPath=1 Include_launcher=1"

[check.capstone]
label=capstone (Python package)
command=python -c "import capstone"
hint=Run: python -m pip install capstone
install=python -m pip install capstone

[check.cmake]
label=CMake 3.20+
exists=%ProgramFiles%\CMake\bin\cmake.exe
command=cmake --version
hint=Install CMake from https://cmake.org/download/ (or add it to PATH).
install=winget install --exact --silent --accept-package-agreements --accept-source-agreements --id Kitware.CMake

[check.msvc]
label=Visual Studio 2022 with the C++ workload
command="%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | findstr :
hint=Install Visual Studio 2022 (Community is fine) with the "Desktop development with C++" workload. If it is installed without it, add the workload in the Visual Studio Installer.
install=winget install --exact --silent --accept-package-agreements --accept-source-agreements --id Microsoft.VisualStudio.2022.Community --override "--wait --quiet --norestart --add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended"

[step.toolkit]
label=Fetch the xboxrecomp toolkit
command=git submodule update --init xboxrecomp
skip_if=xboxrecomp\CMakeLists.txt
weight=0.2

[step.build]
label=Recompile and build the game (about 20 minutes)
command=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\regen_once.ps1
success=BUILD_EXIT=0
skip_if=build\Release\mm3_recomp.exe
; Progress bar: regen.ps1's phases at their share of a 16.5-minute run (disassembly, ABI analysis ~8 min,
; translation, CMake), then MSBuild's one line per compiled source (~213) up to BUILD_EXIT.
progress=JSON exported to=1|ABI entries to=51|Translating=58|Split Translation Complete=65|-- Configuring done=66|BUILD_EXIT=100
progress_count=*.c|213
weight=16

; ---------------------------------------------------------------------------------------------
; Save games (the launcher's Saves page: rename, delete).
[saves]
; The toolkit keeps each title's saves in %LOCALAPPDATA%\xboxrecomp\UDATA\<title id>.
format=xbox
dir=%LOCALAPPDATA%\xboxrecomp\UDATA\4d53002a
